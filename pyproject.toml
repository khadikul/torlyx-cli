[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "torlyx"
version = "0.1.0"
description = "Zero-config security scanner for AI-generated (vibe-coded) web apps. Scan your app before you ship it."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Torlyx" }]
keywords = [
    "security",
    "scanner",
    "sast",
    "fastapi",
    "secrets",
    "vibe-coding",
    "ai-generated-code",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
audit = ["pip-audit>=2.7"]
dev = ["pytest>=8.0", "pip-audit>=2.7"]

[project.urls]
Homepage = "https://github.com/khadikul/torlyx"
Issues = "https://github.com/khadikul/torlyx/issues"

[project.scripts]
torlyx = "torlyx.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["torlyx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
